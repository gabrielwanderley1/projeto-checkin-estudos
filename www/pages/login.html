<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Diário | Login</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <script>if(localStorage.getItem('tema') === 'dark') document.body.classList.add('theme-dark');</script>
    <div class="container">
        <h2>Bem-vindo de volta!</h2>
        <p>Faça login para registrar seu dia de estudo.</p>

        <form id="login-form">
            <div class="input-group">
                <label for="login-username">E-mail</label>
                <input type="email" id="login-username" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
            <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
                <button type="button" id="btn-esqueci-senha" style="background: none; border: none; color: var(--accent-color, #007bff); font-size: 13px; cursor: pointer; text-decoration: underline;">
                    Esqueci minha senha
                </button>
            </div>
        </form>
        
        <div class="divider">ou</div>
        
        <button onclick="window.location.href='cadastro.html'" class="btn-secondary">Criar uma nova conta</button>
    </div>

    <!-- Modal de Recuperação de Senha (OTP) -->
    <div id="modal-recuperacao" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
        <div style="background: var(--bg-panel); padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 12px var(--shadow);">
            <h3 style="margin-bottom: 10px;">Recuperar Senha</h3>
            <p style="font-size: 14px; margin-bottom: 20px; color: var(--text-muted);">Digite o código enviado para o seu e-mail e escolha a nova senha.</p>
            
            <form id="form-recuperacao">
                <div class="input-group">
                    <label for="otp-codigo">Código de 8 dígitos</label>
                    <input type="text" id="otp-codigo" required maxlength="8" style="letter-spacing: 5px; text-align: center; font-size: 20px; font-weight: bold;">
                </div>
                <div class="input-group">
                    <label for="otp-nova-senha">Nova Senha</label>
                    <input type="password" id="otp-nova-senha" required>
                    <ul id="otp-regras-senha" style="font-size: 13px; color: var(--text-muted, #666); margin-top: 8px; padding-left: 20px; text-align: left;">
                        <li id="otp-regra-tamanho">Mínimo de 6 caracteres</li>
                        <li id="otp-regra-maiuscula">Pelo menos uma letra maiúscula</li>
                        <li id="otp-regra-numero">Pelo menos um número</li>
                    </ul>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;" id="btn-confirmar-recuperacao">Confirmar e Alterar</button>
                <button type="button" id="btn-fechar-recuperacao" class="btn-secondary" style="margin-top: 10px;">Cancelar</button>
            </form>
        </div>
    </div>

    <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
