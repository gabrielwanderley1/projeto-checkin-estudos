<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Diário | Minha Streak</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <!-- Usamos uma variação do container, um pouco mais largo para caber os dias -->
    <div class="container container-large">
        
        <!-- Topo: Nome do usuário e botão de sair -->
        <header class="header-user">
            <div class="destaque-nome">Olá, <span id="nome-usuario">Usuário</span>!</div>

            <div class="header-actions">
                <button id="btn-tema" class="btn-secondary btn-theme" type="button">
                    Dark mode
                </button>
                <button class="btn-sair" onclick="window.location.href='login.html'">Sair</button>
            </div>
        </header>

       <!-- Centro Superior: Mês, Calendário e Setas -->
        <div id="mes-atual" class="mes-display">Agosto 2026</div> <!-- NOVO -->

        <div class="calendario-wrapper">
            <button id="btn-voltar-dias" class="seta-nav">◀</button>
            
            <div class="sequencia-dias" id="calendario">
                <!-- Dias gerados pelo JS -->
            </div>
            
            <button id="btn-avancar-dias" class="seta-nav">▶</button> <!-- NOVO -->
        </div>

        <!-- Centro: Número da Streak e Recorde -->
        <div class="streak-container">
            <h1 class="streak-numero"><span id="streak-count">0</span> 🔥</h1>
            <p class="streak-texto">Dias seguidos de estudo</p>
            <p class="streak-maxima">Recorde máximo: <span id="max-streak-count">0</span> dias</p> <!-- NOVO -->
        </div>

        <!-- Centro Baixo: Caixa de texto para anotações -->
        <div class="anotacoes-container">
            <h3 id="titulo-data-anotacao">O que você estudou hoje?</h3>
            <textarea id="texto-anotacao" placeholder="Descreva aqui o que você fez neste dia..."></textarea>
        </div>

        <!-- Fundo: Botão de Check-in -->
        <button id="btn-checkin" class="btn-primary btn-checkin">Registrar Check-in</button>

    </div>

    <script src="../assets/js/principal.js"></script>
</body>
</html>
