<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Diário | Início</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <script>if(localStorage.getItem('tema') === 'dark') document.body.classList.add('theme-dark');</script>
    <nav id="menu-lateral" class="sidebar" aria-label="Navegação principal">
        <a href="inicio.html" class="ativo" aria-current="page">🏠 <span>Início</span></a>
        <a href="editar-plano.html">📚 <span>Plano de Estudo</span></a>
        <a href="configuracoes.html">⚙️ <span>Configurações</span></a>
    </nav>

    <!-- Novo container mais largo com layout em Grid -->
    <div class="container container-inicio">
        
        <!-- COLUNA ESQUERDA: Plano de Estudo -->
        <aside class="plano-estudo-caixa">
            <h3 class="titulo-caixa">Plano de Estudo</h3>
            
            <div class="lista-topicos">
                <!-- Tópico 1 -->
                <div class="topico-item">
                    <div class="topico-cabecalho">
                        <!-- 'disabled' impede a alteração nesta tela -->
                        <input type="checkbox" disabled checked>
                        <span class="topico-titulo">1. Análise e Desenv. de Sistemas</span>
                        <span class="seta-dropdown">▼</span>
                    </div>
                    <!-- Menu suspenso (Subtópicos) -->
                    <div class="subtopicos-lista">
                        <label class="subtopico-item">
                            <input type="checkbox" disabled checked> Modelagem de Dados
                        </label>
                        <label class="subtopico-item">
                            <input type="checkbox" disabled> Arquitetura de Software
                        </label>
                    </div>
                </div>

                <!-- Tópico 2 -->
                <div class="topico-item">
                    <div class="topico-cabecalho">
                        <input type="checkbox" disabled>
                        <span class="topico-titulo">2. Bancos de Dados (SQL)</span>
                        <span class="seta-dropdown">▼</span>
                    </div>
                    <div class="subtopicos-lista">
                        <label class="subtopico-item">
                            <input type="checkbox" disabled> Selects e Joins
                        </label>
                        <label class="subtopico-item">
                            <input type="checkbox" disabled> Tabelas Relacionais
                        </label>
                    </div>
                </div>

                <!-- Tópico 3 -->
                <div class="topico-item">
                    <div class="topico-cabecalho">
                        <input type="checkbox" disabled>
                        <span class="topico-titulo">3. Lógica com JavaScript</span>
                        <span class="seta-dropdown">▼</span>
                    </div>
                    <!-- Sem subtópicos neste exemplo -->
                </div>
            </div>
        </aside>

        <!-- COLUNA DIREITA: Área de Streak (Seu código já existente) -->
        <main class="streak-area">
            <header class="header-user">
                <div class="destaque-nome">Olá, <span id="nome-usuario">Usuário</span>!</div>
                <div class="header-actions">
                    <button id="btn-tema" class="btn-secondary btn-theme" type="button">Dark mode</button>
                    <button class="btn-sair" onclick="window.location.href='login.html'">Sair</button>
                </div>
            </header>

            <div id="mes-atual" class="mes-display">Agosto 2026</div>

            <div class="calendario-wrapper">
                <button id="btn-voltar-dias" class="seta-nav">◀</button>
                <div class="sequencia-dias" id="calendario">
                    <!-- Dias gerados pelo JS -->
                </div>
                <button id="btn-avancar-dias" class="seta-nav">▶</button>
            </div>

            <div class="streak-container">
                <h1 class="streak-numero"><span id="streak-count">0</span> 🔥</h1>
                <p class="streak-texto">Dias seguidos de estudo</p>
                <p class="streak-maxima">Recorde máximo: <span id="max-streak-count">0</span> dias</p>
            </div>

            <div class="anotacoes-container">
                <h3 id="titulo-data-anotacao">O que você estudou hoje?</h3>
                <textarea id="texto-anotacao" placeholder="Descreva aqui o que você fez neste dia..."></textarea>
            </div>

            <button id="btn-checkin" class="btn-primary btn-checkin">Registrar Check-in</button>
        </main>

    </div>

    <script src="../assets/js/inicio.js"></script>
</body>
</html>
