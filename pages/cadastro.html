<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Diário | Cadastro</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <script>if(localStorage.getItem('tema') === 'dark') document.body.classList.add('theme-dark');</script>
    <div class="container">
        <h2>Crie sua conta</h2>
        <p>Comece a construir sua sequência (streak) hoje.</p>
        
        <form id="register-form">
            <div class="input-group">
                <label for="new-username">Escolha um Usuário</label>
                <input type="text" id="new-username" required>
            </div>
            <div class="input-group">
                <label for="new-password">Escolha uma Senha</label>
                <input type="password" id="new-password" required>
            </div>
            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>
        
        <div class="divider">ou</div>
        
        <button onclick="window.location.href='login.html'" class="btn-secondary">Já tenho uma conta</button>
    </div>

    <script src="../assets/js/cadastro.js"></script>
</body>
</html>
